<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>T-FONTE 活動予定カレンダー</title>
    <link rel="icon" href="data:," />

    <style>
        :root {
            --bg: #f3f6fb;
            --card: #ffffff;
            --line: #d9e2ef;
            --text: #1c2733;
            --muted: #627487;
            --accent: #4284f3;
            --accent-soft: #e9f1ff;
            --sun: #d94b45;
            --sat: #3b82f6;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 12px 12px 32px;
            font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
            background: linear-gradient(180deg, #eef5ff 0%, var(--bg) 44%, #eef2f7 100%);
            color: var(--text);
        }

        .shell {
            width: min(640px, 100%);
            margin: 0 auto;
        }

        .top {
            margin-bottom: 10px;
        }

        .title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .sub {
            margin: 2px 0 0;
            font-size: 12px;
            color: var(--muted);
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            background: #e8eef6;
            color: #334155;
        }

        .btn:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .btn-small {
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        a.btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .btn-calendar {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 10px;
            padding: 4px;
            border-radius: 14px;
            background: #e1e9f4;
        }

        .tab {
            padding: 9px 6px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .tab.is-active {
            background: #ffffff;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(42, 72, 120, 0.12);
        }

        .notice {
            padding: 28px 12px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            vertical-align: -3px;
            margin-right: 6px;
            border: 3px solid #d7dfeb;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---- カレンダー ---- */

        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .cal-title {
            font-size: 16px;
            font-weight: 800;
        }

        .cal-nav .btn {
            min-width: 44px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 3px;
            padding: 8px 6px;
            border-radius: 16px;
            background: var(--card);
            box-shadow: 0 4px 14px rgba(42, 72, 120, 0.08);
        }

        .cal-dow {
            padding: 2px 0 4px;
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
        }

        .cal-dow.sun,
        .cal-cell.sun .cal-day {
            color: var(--sun);
        }

        .cal-dow.sat,
        .cal-cell.sat .cal-day {
            color: var(--sat);
        }

        .cal-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 1px;
            min-width: 0;
            min-height: 58px;
            padding: 4px 1px 3px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            font: inherit;
            color: var(--text);
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }

        .cal-cell.blank {
            visibility: hidden;
        }

        .cal-cell.has-events {
            background: var(--accent-soft);
            cursor: pointer;
        }

        .cal-cell.past {
            opacity: .5;
        }

        .cal-cell.today .cal-day {
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            color: #ffffff;
        }

        .cal-cell.selected {
            border-color: var(--accent);
        }

        .cal-day {
            font-size: 12px;
            font-weight: 800;
            line-height: 22px;
        }

        .cal-events {
            display: grid;
            gap: 2px;
            justify-items: center;
            width: 100%;
        }

        /* 予定ごとに「アイコン＋場所の1文字目」と「開始時刻」を2行で出す */
        .cal-ev {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            line-height: 1.1;
        }

        .cal-ev-top {
            font-size: 13px;
            white-space: nowrap;
        }

        .cal-ev-place {
            margin-left: 1px;
            font-size: 10px;
            font-weight: 800;
            color: var(--muted);
        }

        .cal-ev-time {
            font-size: 9px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            white-space: nowrap;
        }

        .cal-more {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
        }

        /* 月の共通リンクは薄めに。その予定だけ別のリンクのときは、濃い緑で目立たせる */
        .btn-answer-soft {
            background: #e3f6ea;
            color: #0b8a3b;
        }

        .answer-bar {
            margin-top: 10px;
        }

        .btn-answer {
            background: #06c755;
            color: #ffffff;
        }

        .answer-bar .btn-answer {
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
        }

        .day-panel {
            margin-top: 12px;
        }

        .hint {
            margin: 8px 4px 0;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }

        /* ---- 予定カード ---- */

        /* ---- 月ごとのカード（送信されるカードに近い見た目） ---- */

        .month-card {
            margin-bottom: 14px;
            border-radius: 18px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.14);
        }

        .month-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 14px;
            background: var(--accent);
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
        }

        .month-card-head .btn {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        .month-card-body {
            display: grid;
            gap: 4px;
            padding: 6px;
        }

        .month-card-foot {
            padding: 4px 14px 14px;
        }

        .month-card-foot .btn-answer {
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 15px;
        }

        .month-card-note {
            margin: 0;
            padding: 4px 14px 12px;
            font-size: 12px;
            text-align: center;
            color: var(--muted);
        }

        .month-card-note.unset {
            color: var(--danger, #d94b45);
        }

        .row-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 8px 10px;
            border-radius: 14px;
            background: #f5f8fd;
        }

        .row-item.past {
            opacity: .5;
        }

        .row-icon {
            flex: 0 0 40px;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e6eef9;
            font-size: 19px;
            line-height: 1;
        }

        .row-body {
            min-width: 0;
            flex: 1;
        }

        .row-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .row-title {
            margin: 0;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.4;
            word-break: break-word;
        }

        .row-until {
            flex: 0 0 auto;
            padding: 2px 8px;
            border-radius: 999px;
            background: #e6eef9;
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .row-until.today {
            background: #ffe2bf;
            color: #a54b00;
        }

        .row-until.done {
            color: var(--muted);
        }

        .row-meta {
            margin: 1px 0 0;
            font-size: 12px;
            line-height: 1.55;
            color: var(--muted);
            word-break: break-word;
        }

        .row-meta .sun {
            color: var(--sun);
        }

        .row-meta .sat {
            color: var(--sat);
        }

        .row-actions {
            display: grid;
            gap: 6px;
            margin-top: 6px;
        }

        /* 回答リンクとカレンダー追加は横並びで、幅を等分する */
        .row-links {
            display: flex;
            gap: 6px;
        }

        .row-links .btn {
            flex: 1 1 0;
            justify-content: center;
            white-space: nowrap;
        }

        .row-ops {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

    </style>
</head>

<body>
    <main class="shell">
        <div class="top">
            <h1 class="title">T-FONTE 活動予定</h1>
            <p class="sub">今月からの予定です。</p>
        </div>

        <div id="loading" class="notice"><span class="spinner"></span>読み込み中...</div>

        <section id="error" class="notice" hidden>
            <strong id="errorMessage"></strong>
            <p><button id="retryBtn" class="btn" type="button">もう一度試す</button></p>
        </section>

        <section id="main" hidden>
            <div class="tabs" role="tablist">
                <button id="tabCal" class="tab is-active" type="button" role="tab" aria-selected="true">🗓️ カレンダー</button>
                <button id="tabList" class="tab" type="button" role="tab" aria-selected="false">📋 リスト</button>
            </div>
            <div id="calendar"></div>
            <div id="list" hidden></div>
        </section>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzXgPNJkiAB4eGVUwExQ8ehA8wMM93rSGk8OcvZe-1fo6ozalkr4Ov83KCwouA5WN1K/exec";
        const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

        const $ = id => document.getElementById(id);

        let records = [];
        let view = "calendar";
        let calMonth = "";
        let selectedDate = "";

        // ---------- 読み込み ----------

        async function load() {
            $("loading").hidden = false;
            $("error").hidden = true;
            $("main").hidden = true;
            try {
                const response = await fetch(`${GAS_URL}?action=plans`);
                const data = await response.json();
                if (!data.ok) throw new Error(data.message || "取得できませんでした");

                records = data.records;
                calMonth = todayKey().slice(0, 7);
                selectedDate = "";
                $("loading").hidden = true;
                $("main").hidden = false;
                render();
            } catch (err) {
                console.error(err);
                $("loading").hidden = true;
                $("errorMessage").textContent = "予定を読み込めませんでした。";
                $("error").hidden = false;
            }
        }

        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }

        function monthLabel(month) {
            return `${month.slice(0, 4)}年${Number(month.slice(5, 7))}月`;
        }

        /** 先頭の1文字（絵文字なども1つの文字として数える） */
        function firstGrapheme(text) {
            if (window.Intl && Intl.Segmenter) {
                return new Intl.Segmenter("ja", { granularity: "grapheme" }).segment(text)[Symbol.iterator]().next().value.segment;
            }
            return Array.from(text)[0];
        }

        /** 内容の1文字目（絵文字は1つの文字として）をアイコンにする */
        function iconOf(memo) {
            const text = String(memo || "").trim();
            if (!text) return "📅";
            if (window.Intl && Intl.Segmenter) {
                return new Intl.Segmenter("ja", { granularity: "grapheme" }).segment(text)[Symbol.iterator]().next().value.segment;
            }
            return Array.from(text)[0];
        }

        /** その月で一番よく使われているリンクを、月の共通（回答）リンクとみなす（同数なら後に登録されたもの） */
        function baseLinkFor(month) {
            const counts = new Map();
            records.forEach(record => {
                if (record.date.slice(0, 7) === month && record.link) {
                    counts.set(record.link, (counts.get(record.link) || 0) + 1);
                }
            });
            let best = "";
            let bestCount = 0;
            counts.forEach((count, link) => {
                if (count >= bestCount) { best = link; bestCount = count; }
            });
            return best;
        }

        function createAnswerLink(label, href, className = "btn btn-small btn-answer") {
            const link = document.createElement("a");
            link.className = className;
            link.href = href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = label;
            return link;
        }

        function button(label, className, handler, disabled = false) {
            const el = document.createElement("button");
            el.type = "button";
            el.className = className;
            el.textContent = label;
            el.disabled = disabled;
            el.addEventListener("click", handler);
            return el;
        }

        // ---------- 描画 ----------

        function render() {
            $("calendar").hidden = view !== "calendar";
            $("list").hidden = view !== "list";
            $("tabCal").classList.toggle("is-active", view === "calendar");
            $("tabList").classList.toggle("is-active", view === "list");
            $("tabCal").setAttribute("aria-selected", String(view === "calendar"));
            $("tabList").setAttribute("aria-selected", String(view === "list"));
            renderCalendar();
            renderList();
        }

        function shiftMonth(delta) {
            const [y, m] = calMonth.split("-").map(Number);
            const next = new Date(y, m - 1 + delta, 1);
            calMonth = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}`;
            selectedDate = "";
            renderCalendar();
        }

        function renderCalendar() {
            const today = todayKey();
            const thisMonth = today.slice(0, 7);
            const lastMonth = records.reduce((max, r) => (r.date.slice(0, 7) > max ? r.date.slice(0, 7) : max), thisMonth);
            const [year, month] = calMonth.split("-").map(Number);

            const byDate = new Map();
            records.forEach(record => {
                if (!byDate.has(record.date)) byDate.set(record.date, []);
                byDate.get(record.date).push(record);
            });

            const title = document.createElement("span");
            title.className = "cal-title";
            title.textContent = monthLabel(calMonth);
            const nav = document.createElement("div");
            nav.className = "cal-nav";
            nav.append(
                button("◀", "btn", () => shiftMonth(-1), calMonth <= thisMonth),
                title,
                button("▶", "btn", () => shiftMonth(1), calMonth >= lastMonth)
            );

            const grid = document.createElement("div");
            grid.className = "cal-grid";
            WEEKDAYS.forEach((name, index) => {
                const dow = document.createElement("div");
                dow.className = `cal-dow${index === 0 ? " sun" : index === 6 ? " sat" : ""}`;
                dow.textContent = name;
                grid.appendChild(dow);
            });

            for (let i = 0; i < new Date(year, month - 1, 1).getDay(); i++) {
                const blank = document.createElement("div");
                blank.className = "cal-cell blank";
                grid.appendChild(blank);
            }
            for (let day = 1; day <= new Date(year, month, 0).getDate(); day++) {
                const date = `${calMonth}-${String(day).padStart(2, "0")}`;
                grid.appendChild(createCell(date, day, byDate.get(date) || [], today));
            }

            const children = [nav, grid];
            const monthLink = baseLinkFor(calMonth);
            if (monthLink) {
                const bar = document.createElement("div");
                bar.className = "answer-bar";
                bar.appendChild(createAnswerLink(`📝 ${month}月の回答リンクを開く`, monthLink, "btn btn-answer"));
                children.push(bar);
            }
            const dayRecords = byDate.get(selectedDate) || [];
            if (selectedDate.startsWith(calMonth) && dayRecords.length) {
                children.push(createDayPanel(selectedDate, dayRecords, today));
            } else if (![...byDate.keys()].some(date => date.startsWith(calMonth))) {
                const hint = document.createElement("p");
                hint.className = "hint";
                hint.textContent = "この月の予定はまだありません。";
                children.push(hint);
            } else {
                const hint = document.createElement("p");
                hint.className = "hint";
                hint.textContent = "色のついた日をタップすると、予定が表示されます。";
                children.push(hint);
            }
            $("calendar").replaceChildren(...children);
        }

        /** マス目に出す予定1件分: 「アイコン＋場所の1文字目」と「開始時刻」 */
        function createCellEvent(record) {
            const item = document.createElement("span");
            item.className = "cal-ev";

            const top = document.createElement("span");
            top.className = "cal-ev-top";
            top.append(document.createTextNode(iconOf(record.memo1)));
            const place = String(record.place || "").trim();
            if (place) {
                const placeChar = document.createElement("span");
                placeChar.className = "cal-ev-place";
                placeChar.textContent = firstGrapheme(place);
                top.appendChild(placeChar);
            }

            const time = document.createElement("span");
            time.className = "cal-ev-time";
            time.textContent = record.start;

            item.append(top, time);
            return item;
        }

        function createCell(date, day, dayRecords, today) {
            const weekday = new Date(date.replaceAll("-", "/")).getDay();
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = ["cal-cell",
                weekday === 0 ? "sun" : weekday === 6 ? "sat" : "",
                dayRecords.length ? "has-events" : "",
                date === today ? "today" : "",
                date < today ? "past" : "",
                date === selectedDate ? "selected" : ""].filter(Boolean).join(" ");

            const number = document.createElement("span");
            number.className = "cal-day";
            number.textContent = String(day);
            cell.appendChild(number);

            if (dayRecords.length) {
                const events = document.createElement("span");
                events.className = "cal-events";
                dayRecords.slice(0, 2).forEach(record => events.appendChild(createCellEvent(record)));
                cell.appendChild(events);
                if (dayRecords.length > 2) {
                    const more = document.createElement("span");
                    more.className = "cal-more";
                    more.textContent = `+${dayRecords.length - 2}`;
                    cell.appendChild(more);
                }
                cell.setAttribute("aria-label", `${date} 予定${dayRecords.length}件`);
                cell.addEventListener("click", () => {
                    selectedDate = date;
                    renderCalendar();
                });
            }
            return cell;
        }

        function createDayPanel(date, dayRecords, today) {
            const [y, m, d] = date.split("-").map(Number);
            const card = document.createElement("section");
            card.className = "month-card day-panel";

            const head = document.createElement("div");
            head.className = "month-card-head";
            head.textContent = `${m}月${d}日(${WEEKDAYS[new Date(y, m - 1, d).getDay()]})`;

            const body = document.createElement("div");
            body.className = "month-card-body";
            dayRecords.forEach(record => body.appendChild(createRowItem(record, today)));

            card.append(head, body);
            return card;
        }

        function renderList() {
            const today = todayKey();
            const root = $("list");
            root.replaceChildren();

            if (!records.length) {
                const empty = document.createElement("div");
                empty.className = "notice";
                empty.textContent = "予定はまだありません。";
                root.appendChild(empty);
                return;
            }

            const byMonth = new Map();
            records.forEach(record => {
                const month = record.date.slice(0, 7);
                if (!byMonth.has(month)) byMonth.set(month, []);
                byMonth.get(month).push(record);
            });

            byMonth.forEach((monthRecords, month) => root.appendChild(createMonthCard(month, monthRecords, today)));
        }

        function createMonthCard(month, monthRecords, today) {
            const card = document.createElement("section");
            card.className = "month-card";

            const head = document.createElement("div");
            head.className = "month-card-head";
            head.textContent = `${Number(month.slice(5, 7))}月の予定`;

            const body = document.createElement("div");
            body.className = "month-card-body";
            monthRecords.forEach(record => body.appendChild(createRowItem(record, today)));
            card.append(head, body);

            const monthLink = baseLinkFor(month);
            if (monthLink) {
                const foot = document.createElement("div");
                foot.className = "month-card-foot";
                foot.appendChild(createAnswerLink(`${Number(month.slice(5, 7))}月のリンクを開く`, monthLink, "btn btn-answer"));
                card.appendChild(foot);
            }
            return card;
        }

        /** 回答リンクとカレンダー追加を、行ごとに横並びで添える */
        function createRowActions(record) {
            const links = document.createElement("div");
            links.className = "row-links";
            // その予定だけ別のリンクならそれを、なければ月の共通リンクを開く
            const baseLink = baseLinkFor(record.date.slice(0, 7));
            const answerLink = record.link || baseLink;
            if (answerLink) {
                const isCommon = answerLink === baseLink;
                links.appendChild(createAnswerLink(
                    "📝 回答リンク",
                    answerLink,
                    isCommon ? "btn btn-small btn-answer-soft" : "btn btn-small btn-answer"
                ));
            }
            links.appendChild(createCalendarLink(record));

            const actions = document.createElement("div");
            actions.className = "row-actions";
            actions.appendChild(links);
            return actions;
        }

        /** 内容の先頭が絵文字なら、アイコン欄に出す分を題名から外す（送信されるカードと同じ見せ方） */
        function splitMemoIcon(memo) {
            const text = String(memo || "").trim();
            const match = /^(\p{Extended_Pictographic}\uFE0F?)\s*/u.exec(text);
            return match ? { icon: match[1], title: text.slice(match[0].length) || text } : { icon: iconOf(text), title: text };
        }

        function createRowItem(record, today) {
            const [y, m, d] = record.date.split("-").map(Number);
            const weekday = new Date(y, m - 1, d).getDay();
            const { icon: iconText, title: titleText } = splitMemoIcon(record.memo1);

            const row = document.createElement("article");
            row.className = `row-item${record.date < today ? " past" : ""}`;

            const icon = document.createElement("div");
            icon.className = "row-icon";
            icon.textContent = iconText;

            const body = document.createElement("div");
            body.className = "row-body";

            const head = document.createElement("div");
            head.className = "row-head";
            const title = document.createElement("h3");
            title.className = "row-title";
            title.textContent = titleText;
            const until = untilLabel(record.date);
            const badge = document.createElement("span");
            badge.className = `row-until${until.className ? ` ${until.className}` : ""}`;
            badge.textContent = until.text;
            head.append(title, badge);

            const dateLine = document.createElement("p");
            dateLine.className = "row-meta";
            const dow = document.createElement("span");
            dow.className = weekday === 0 ? "sun" : weekday === 6 ? "sat" : "";
            dow.textContent = `(${WEEKDAYS[weekday]})`;
            dateLine.append(
                document.createTextNode(`${m}月${d}日`),
                dow,
                document.createTextNode(` ${record.start}${record.end ? `-${record.end}` : ""}`)
            );

            const placeLine = document.createElement("p");
            placeLine.className = "row-meta";
            placeLine.textContent = [record.place, record.memo2].filter(Boolean).join(" ");

            body.append(head, dateLine, placeLine);
            const actions = createRowActions(record);
            if (actions) body.appendChild(actions);

            row.append(icon, body);
            return row;
        }

        /** 今日からの残り日数の表示（過ぎた予定は「終了」） */
        function untilLabel(dateKey) {
            const [y, m, d] = dateKey.split("-").map(Number);
            const now = new Date();
            const days = Math.round((new Date(y, m - 1, d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
            if (days < 0) return { text: "終了", className: "done" };
            if (days === 0) return { text: "今日", className: "today" };
            return { text: `あと${days}日`, className: "" };
        }

        /** Googleカレンダーに予定を追加するリンク（送信カードの「カレンダー追加」と同じ内容） */
        function createCalendarLink(record) {
            const compact = (date, time) => `${date.replaceAll("-", "")}T${time.replace(":", "")}00`;
            const end = record.end || record.start;
            const params = [
                "action=TEMPLATE",
                `text=${encodeURIComponent(record.memo1 || "予定")}`,
                `dates=${encodeURIComponent(`${compact(record.date, record.start)}/${compact(record.date, end)}`)}`,
                `location=${encodeURIComponent(record.place || "")}`,
                `details=${encodeURIComponent(record.memo2 || "")}`,
                "ctz=Asia%2FTokyo"
            ];

            const link = document.createElement("a");
            link.className = "btn btn-small btn-calendar";
            link.href = `https://calendar.google.com/calendar/render?${params.join("&")}`;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "📅 カレンダー追加";
            return link;
        }

        // ---------- イベント ----------

        $("tabCal").addEventListener("click", () => { view = "calendar"; render(); });
        $("tabList").addEventListener("click", () => { view = "list"; render(); });
        $("retryBtn").addEventListener("click", load);

        load();
    </script>
</body>

</html>
