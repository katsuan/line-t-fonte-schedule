<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>T-FONTE 予定の管理</title>
    <link rel="icon" href="data:," />

    <link rel="stylesheet" href="admin.css?v=202610291728" />
</head>

<body>
    <main class="shell">
        <nav class="nav">
            <a class="chip" href="./index.html">‹ ホーム</a>
            <a class="chip" href="./calendar.html" target="_blank" rel="noopener">公開カレンダー ›</a>
        </nav>
        <div class="top">
            <h1 class="title">予定の管理</h1>
        </div>

        <div id="loading" class="notice"><span class="spinner"></span>読み込み中...</div>

        <section id="forbidden" class="panel" hidden>
            <strong>管理者として登録されていません</strong>
            <p>管理者に、下のIDを Script Property <b>ADMIN_USER_IDS</b>（複数はカンマ区切り）へ追加してもらってください。</p>
            <code id="userId"></code>
            <button id="copyUserId" class="btn" type="button">IDをコピー</button>
        </section>

        <section id="fatal" class="panel" hidden>
            <strong id="fatalMessage"></strong>
            <p><button id="retryBtn" class="btn" type="button">もう一度試す</button></p>
        </section>

        <section id="main" hidden>
            <div class="tabs" role="tablist">
                <button id="tabCal" class="tab is-active" type="button" role="tab" aria-selected="true">🗓️ カレンダー</button>
                <button id="tabList" class="tab" type="button" role="tab" aria-selected="false">📋 リスト</button>
            </div>
            <div class="toolbar">
                <label id="pastLabel"><input id="showPast" type="checkbox" /> 過去の予定も表示</label>
                <div class="toolbar-actions">
                    <button id="bulkBtn" class="btn btn-small" type="button">📝 文章で追加</button>
                    <button id="syncBtn" class="btn btn-small" type="button">📅 カレンダー同期</button>
                    <button id="reloadBtn" class="btn btn-small" type="button">再読み込み</button>
                </div>
            </div>
            <div id="list"></div>
            <div id="calendar" hidden></div>
        </section>
    </main>

    <button id="addBtn" class="btn btn-primary fab" type="button" hidden>＋ 予定を追加</button>

    <dialog id="editor">
        <form id="form" class="form" method="dialog" novalidate>
            <h2 id="formTitle" tabindex="-1">予定を追加</h2>
            <label class="field">日付<input id="fDate" type="date" required /></label>
            <div class="row">
                <label class="field">開始<input id="fStart" type="time" required /></label>
                <label class="field">終了<input id="fEnd" type="time" /></label>
            </div>
            <div class="field">
                <label for="fMemo1Sel">内容</label>
                <select id="fMemo1Sel"></select>
                <input id="fMemo1" type="text" placeholder="例: ⚽フットサル" autocomplete="off" hidden />
            </div>
            <div class="field">
                <label for="fPlaceSel">場所</label>
                <select id="fPlaceSel"></select>
                <input id="fPlace" type="text" placeholder="場所を入力" autocomplete="off" hidden />
            </div>
            <label class="field">補足（例: ①）<input id="fMemo2" type="text" autocomplete="off" /></label>
            <div class="field">
                <span>回答リンク</span>
                <label class="toggle">
                    <input id="fLinkCommon" type="checkbox" />
                    <span id="fLinkCommonText">月の共通リンクを使う</span>
                </label>
                <input id="fLink" type="url" inputmode="url" placeholder="この予定だけのリンク（https://…）" />
                <p id="fLinkNote" class="link-note" hidden></p>
            </div>
            <p id="formError" class="form-error" hidden></p>
            <div class="form-actions">
                <button id="cancelBtn" class="btn" type="button">キャンセル</button>
                <button id="saveBtn" class="btn btn-primary" type="submit">保存</button>
            </div>
        </form>
    </dialog>

    <dialog id="bulkDialog">
        <div class="form">
            <h2 id="bulkTitle" tabindex="-1">文章でまとめて追加</h2>

            <section id="bulkStepInput" class="bulk-step">
                <p class="bulk-help">1行に1件、「日付 開始〜終了 場所 内容」の順に書きます。最後の行にURLを書くと、リンクのない予定に入ります。スプレッドシートからコピーした行（タブ区切り）も読めます。</p>
                <textarea id="bulkText" spellcheck="false" placeholder="10月17日 17:00〜19:00 灘崎総合公園 フットサル①&#10;10月24日 18:00〜20:00 灘崎総合公園 フットサル②&#10;https://example.com/answer"></textarea>
                <p id="bulkError" class="form-error" hidden></p>
                <div class="form-actions">
                    <button id="bulkCancel" class="btn" type="button">キャンセル</button>
                    <button id="bulkParse" class="btn btn-primary" type="button">読み取る</button>
                </div>
            </section>

            <section id="bulkStepConfirm" class="bulk-step" hidden>
                <p id="bulkSummary" class="bulk-help"></p>
                <div id="bulkList" class="bulk-list"></div>
                <div id="bulkErrors" class="bulk-errors" hidden></div>
                <p id="bulkConfirmError" class="form-error" hidden></p>
                <div class="form-actions">
                    <button id="bulkBack" class="btn" type="button">‹ 入力に戻る</button>
                    <button id="bulkSubmit" class="btn btn-primary" type="button">登録する</button>
                </div>
            </section>
        </div>
    </dialog>

    <div id="toast" class="toast" hidden></div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script src="js/month-calendar.js?v=202610291728"></script>
    <script src="admin.js?v=202610291728"></script>
</body>

</html>
