<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>T-FONTE 予定の管理</title>
    <link rel="icon" href="data:," />

    <style>
        :root {
            --bg: #f3f6fb;
            --card: #ffffff;
            --line: #d9e2ef;
            --text: #1c2733;
            --muted: #627487;
            --primary: #06c755;
            --primary-dark: #05a347;
            --accent: #4284f3;
            --accent-soft: #e9f1ff;
            --danger: #d94b45;
            --danger-soft: #fdecec;
            --sun: #d94b45;
            --sat: #3b82f6;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 12px 12px 96px;
            font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
            background: linear-gradient(180deg, #eef5ff 0%, var(--bg) 44%, #eef2f7 100%);
            color: var(--text);
        }

        .shell {
            width: min(640px, 100%);
            margin: 0 auto;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--muted);
        }

        .toolbar #reloadBtn {
            margin-left: auto;
        }

        .toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            background: #e8eef6;
            color: #334155;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-danger {
            background: var(--danger-soft);
            color: var(--danger);
        }

        .btn-small {
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 10px;
            padding: 4px;
            border-radius: 14px;
            background: #e1e9f4;
        }

        .tab {
            padding: 9px 6px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .tab.is-active {
            background: #ffffff;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(42, 72, 120, 0.12);
        }

        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .cal-title {
            font-size: 16px;
            font-weight: 800;
        }

        .cal-nav .btn {
            min-width: 44px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 3px;
            padding: 8px 6px;
            border-radius: 16px;
            background: var(--card);
            box-shadow: 0 4px 14px rgba(42, 72, 120, 0.08);
        }

        .cal-dow {
            padding: 2px 0 4px;
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
        }

        .cal-dow.sun,
        .cal-cell.sun .cal-day {
            color: var(--sun);
        }

        .cal-dow.sat,
        .cal-cell.sat .cal-day {
            color: var(--sat);
        }

        .cal-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 1px;
            min-width: 0;
            min-height: 58px;
            padding: 4px 1px 3px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            font: inherit;
            color: var(--text);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .cal-cell.blank {
            visibility: hidden;
            pointer-events: none;
        }

        .cal-cell.has-events {
            background: var(--accent-soft);
        }

        .cal-cell.past {
            opacity: .5;
        }

        .cal-cell.today .cal-day {
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            color: #ffffff;
        }

        .cal-cell.selected {
            border-color: var(--accent);
        }

        .cal-day {
            font-size: 12px;
            font-weight: 800;
            line-height: 22px;
        }

        .cal-icons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0 1px;
            font-size: 15px;
            line-height: 1.25;
            max-width: 100%;
            overflow: hidden;
        }

        .cal-more {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
        }

        .day-panel {
            margin-top: 12px;
        }

        .day-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 0 4px 8px;
            font-size: 14px;
            font-weight: 800;
        }

        .field select {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: inherit;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
            background: #ffffff;
        }

        .field > label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
        }

        .month {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 14px 4px 6px;
        }

        .month-label {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent);
        }

        .month-link {
            margin: -2px 4px 6px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--muted);
            word-break: break-all;
        }

        .month-link.unset {
            color: var(--danger);
        }

        .list {
            display: grid;
            gap: 8px;
        }

        .item {
            display: grid;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 16px;
            background: var(--card);
            box-shadow: 0 4px 14px rgba(42, 72, 120, 0.08);
        }

        .item.past {
            opacity: .55;
        }

        .item-main {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .item-date {
            flex: 0 0 auto;
            min-width: 62px;
            text-align: center;
            padding: 6px 4px;
            border-radius: 12px;
            background: var(--accent-soft);
            line-height: 1.25;
        }

        .item-date strong {
            display: block;
            font-size: 16px;
        }

        .item-date small {
            font-size: 11px;
            font-weight: 700;
        }

        .item-date.sun small {
            color: var(--sun);
        }

        .item-date.sat small {
            color: var(--sat);
        }

        .item-body {
            min-width: 0;
            flex: 1;
        }

        .item-title {
            margin: 0;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.4;
            word-break: break-word;
        }

        .item-time {
            margin: 3px 0 0;
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            color: var(--text);
        }

        .item-meta {
            margin: 2px 0 0;
            font-size: 12px;
            line-height: 1.5;
            color: var(--muted);
            word-break: break-word;
        }

        .item-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
        }

        a.btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .btn-calendar {
            margin-right: auto;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .empty,
        .notice {
            padding: 24px 12px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .panel {
            padding: 18px 16px;
            border-radius: 20px;
            background: var(--card);
            box-shadow: 0 4px 14px rgba(42, 72, 120, 0.08);
            font-size: 14px;
            line-height: 1.7;
        }

        .panel code {
            display: block;
            margin: 8px 0;
            padding: 10px;
            border-radius: 10px;
            background: #f1f5f9;
            font-size: 12px;
            word-break: break-all;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            vertical-align: -3px;
            margin-right: 6px;
            border: 3px solid #d7dfeb;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        dialog {
            width: min(520px, calc(100% - 24px));
            max-height: calc(100% - 24px);
            padding: 0;
            border: 0;
            border-radius: 20px;
            color: var(--text);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
        }

        dialog::backdrop {
            background: rgba(15, 23, 42, 0.45);
        }

        .form {
            display: grid;
            gap: 12px;
            padding: 16px;
        }

        .form h2 {
            margin: 0;
            font-size: 16px;
        }

        .field {
            display: grid;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
        }

        .field input {
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 46px;
            -webkit-appearance: none;
            appearance: none;
            text-align: left;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: inherit;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
            background: #ffffff;
        }

        .row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
        }

        /* iOS の date / time 入力は中の表示が中央寄せ・縮みやすいので、左寄せで高さをそろえる */
        .field input[type="date"],
        .field input[type="time"] {
            font-variant-numeric: tabular-nums;
        }

        .field input::-webkit-date-and-time-value {
            min-height: 1.4em;
            text-align: left;
        }

        .form-error {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--danger);
        }

        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .fab {
            position: fixed;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom));
            z-index: 10;
            padding: 14px 18px;
            border-radius: 999px;
            box-shadow: 0 10px 24px rgba(5, 163, 71, 0.4);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(76px + env(safe-area-inset-bottom));
            z-index: 30;
            transform: translateX(-50%);
            max-width: calc(100% - 32px);
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        .toast.error {
            background: rgba(185, 28, 28, 0.95);
        }
    </style>
</head>

<body>
    <main class="shell">
        <div class="top">
            <h1 class="title">予定の管理</h1>
            <span class="chip">管理者</span>
        </div>

        <div id="loading" class="notice"><span class="spinner"></span>読み込み中...</div>

        <section id="forbidden" class="panel" hidden>
            <strong>管理者として登録されていません</strong>
            <p>管理者に、下のIDを Script Property <b>ADMIN_USER_IDS</b>（複数はカンマ区切り）へ追加してもらってください。</p>
            <code id="userId"></code>
            <button id="copyUserId" class="btn" type="button">IDをコピー</button>
        </section>

        <section id="fatal" class="panel" hidden>
            <strong id="fatalMessage"></strong>
            <p><button id="retryBtn" class="btn" type="button">もう一度試す</button></p>
        </section>

        <section id="main" hidden>
            <div class="tabs" role="tablist">
                <button id="tabList" class="tab is-active" type="button" role="tab" aria-selected="true">📋 リスト</button>
                <button id="tabCal" class="tab" type="button" role="tab" aria-selected="false">🗓️ カレンダー</button>
            </div>
            <div class="toolbar">
                <label id="pastLabel"><input id="showPast" type="checkbox" /> 過去の予定も表示</label>
                <button id="reloadBtn" class="btn btn-small" type="button">再読み込み</button>
            </div>
            <div id="list"></div>
            <div id="calendar" hidden></div>
        </section>
    </main>

    <button id="addBtn" class="btn btn-primary fab" type="button" hidden>＋ 予定を追加</button>

    <dialog id="editor">
        <form id="form" class="form" method="dialog" novalidate>
            <h2 id="formTitle">予定を追加</h2>
            <label class="field">日付<input id="fDate" type="date" required /></label>
            <div class="row">
                <label class="field">開始<input id="fStart" type="time" required /></label>
                <label class="field">終了<input id="fEnd" type="time" /></label>
            </div>
            <div class="field">
                <label for="fPlaceSel">場所</label>
                <select id="fPlaceSel"></select>
                <input id="fPlace" type="text" placeholder="場所を入力" autocomplete="off" hidden />
            </div>
            <div class="field">
                <label for="fMemo1Sel">内容</label>
                <select id="fMemo1Sel"></select>
                <input id="fMemo1" type="text" placeholder="例: ⚽フットサル" autocomplete="off" hidden />
            </div>
            <label class="field">補足（例: ①）<input id="fMemo2" type="text" autocomplete="off" /></label>
            <label class="field">リンク<input id="fLink" type="url" inputmode="url" placeholder="月の共通リンクが自動で入ります" /></label>
            <p id="formError" class="form-error" hidden></p>
            <div class="form-actions">
                <button id="cancelBtn" class="btn" type="button">キャンセル</button>
                <button id="saveBtn" class="btn btn-primary" type="submit">保存</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
        const LIFF_ID = "2009927582-9QtOstUK";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzXgPNJkiAB4eGVUwExQ8ehA8wMM93rSGk8OcvZe-1fo6ozalkr4Ov83KCwouA5WN1K/exec";
        const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

        const $ = id => document.getElementById(id);
        const els = {
            loading: $("loading"), forbidden: $("forbidden"), fatal: $("fatal"), fatalMessage: $("fatalMessage"),
            main: $("main"), list: $("list"), showPast: $("showPast"), addBtn: $("addBtn"),
            editor: $("editor"), form: $("form"), formTitle: $("formTitle"), formError: $("formError"),
            saveBtn: $("saveBtn"), toast: $("toast")
        };

        let records = [];
        let editing = null; // 編集中の予定（追加のときは null）
        let linkTouched = false; // リンク欄を自分で書き換えたら、日付を変えても月の共通リンクで上書きしない
        let toastTimer = null;

        // ---------- 通信 ----------

        async function callApi(action, payload = {}) {
            const response = await fetch(GAS_URL, {
                method: "POST",
                // text/plain にして CORS のプリフライトを避ける（GAS は OPTIONS を受けられない）
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action, accessToken: liff.getAccessToken(), ...payload })
            });
            return response.json();
        }

        // ---------- 起動 ----------

        async function start() {
            show("loading");
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: location.href });
                    return;
                }

                const who = await callApi("whoami");
                if (!who.ok) return fail(who.message);
                if (!who.isAdmin) {
                    $("userId").textContent = who.userId;
                    return show("forbidden");
                }

                await loadRecords();
                applyView();
                show("main");
            } catch (err) {
                console.error(err);
                fail("読み込みに失敗しました。通信状況を確認してください。");
            }
        }

        function show(name) {
            ["loading", "forbidden", "fatal", "main"].forEach(key => { els[key].hidden = key !== name; });
            els.addBtn.hidden = name !== "main";
        }

        function fail(message) {
            els.fatalMessage.textContent = message || "エラーが発生しました。";
            show("fatal");
        }

        async function loadRecords() {
            const result = await callApi("list");
            if (!result.ok) throw new Error(result.message);
            applyRecords(result.records);
        }

        function applyRecords(next) {
            records = next.slice().sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
            render();
            renderSuggestions();
        }

        // ---------- 描画 ----------

        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }

        function render() {
            renderList();
            renderCalendar();
        }

        function renderList() {
            const today = todayKey();
            const visible = records.filter(r => els.showPast.checked || r.date >= today);
            els.list.replaceChildren();

            if (!visible.length) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "予定はありません。右下の「＋ 予定を追加」から登録できます。";
                els.list.appendChild(empty);
                return;
            }

            let currentMonth = "";
            let group = null;
            visible.forEach(record => {
                const month = record.date.slice(0, 7);
                if (month !== currentMonth) {
                    currentMonth = month;
                    els.list.append(createMonthHeader(month), createMonthLink(month));
                    group = document.createElement("div");
                    group.className = "list";
                    els.list.appendChild(group);
                }
                group.appendChild(createItem(record, today));
            });
        }

        function monthLabel(month) {
            return `${month.slice(0, 4)}年${Number(month.slice(5, 7))}月`;
        }

        /** その月で一番よく使われているリンクを、月の共通リンクとみなす（同数なら後に登録されたもの） */
        function baseLinkFor(month) {
            const counts = new Map();
            records.forEach(record => {
                if (record.date.slice(0, 7) === month && record.link) {
                    counts.set(record.link, (counts.get(record.link) || 0) + 1);
                }
            });
            let best = "";
            let bestCount = 0;
            counts.forEach((count, link) => {
                if (count >= bestCount) { best = link; bestCount = count; }
            });
            return best;
        }

        function createMonthHeader(month) {
            const head = document.createElement("div");
            head.className = "month";
            const label = document.createElement("span");
            label.className = "month-label";
            label.textContent = monthLabel(month);
            head.append(label, actionButton("共通リンク", "btn btn-small", () => editMonthLink(month)));
            return head;
        }

        function createMonthLink(month) {
            const base = baseLinkFor(month);
            const line = document.createElement("div");
            line.className = `month-link${base ? "" : " unset"}`;
            line.textContent = base ? `🔗 ${base}` : "共通リンクが未設定です";
            return line;
        }

        async function editMonthLink(month) {
            const current = baseLinkFor(month);
            const input = prompt(
                `${monthLabel(month)}の共通リンク\n（別のリンクを入れている予定は、そのままにします）`,
                current
            );
            if (input === null) return;

            const link = input.trim();
            if (!/^https?:\/\//.test(link)) return showToast("http(s):// から入力してください", true);
            if (link === current) return;

            try {
                const result = await callApi("setMonthLink", { month, fromLink: current, link });
                if (!result.ok) return showToast(result.message || "更新できませんでした", true);
                applyRecords(result.records);
                showToast("共通リンクを更新しました");
            } catch (err) {
                console.error(err);
                showToast("通信に失敗しました", true);
            }
        }

        function createItem(record, today) {
            const [y, m, d] = record.date.split("-").map(Number);
            const weekday = new Date(y, m - 1, d).getDay();

            const item = document.createElement("article");
            item.className = `item${record.date < today ? " past" : ""}`;

            const date = document.createElement("div");
            date.className = `item-date${weekday === 0 ? " sun" : weekday === 6 ? " sat" : ""}`;
            const strong = document.createElement("strong");
            strong.textContent = `${m}/${d}`;
            const small = document.createElement("small");
            small.textContent = `(${WEEKDAYS[weekday]})`;
            date.append(strong, small);

            const body = document.createElement("div");
            body.className = "item-body";
            const title = document.createElement("h3");
            title.className = "item-title";
            title.textContent = [record.memo1, record.memo2].filter(Boolean).join(" ");
            const time = document.createElement("p");
            time.className = "item-time";
            time.textContent = `${record.start}${record.end ? ` 〜 ${record.end}` : ""}`;
            const place = document.createElement("p");
            place.className = "item-meta";
            place.textContent = `📍 ${record.place}`;
            body.append(title, time, place);
            if (record.link) {
                const link = document.createElement("p");
                link.className = "item-meta";
                link.textContent = `🔗 ${record.link}`;
                body.appendChild(link);
            }

            const main = document.createElement("div");
            main.className = "item-main";
            main.append(date, body);

            const actions = document.createElement("div");
            actions.className = "item-actions";
            actions.append(
                createCalendarLink(record),
                actionButton("複製", "btn btn-small", () => openEditor(record, true)),
                actionButton("編集", "btn btn-small", () => openEditor(record, false)),
                actionButton("削除", "btn btn-small btn-danger", () => removeRecord(record))
            );

            item.append(main, actions);
            return item;
        }

        /** Googleカレンダーに予定を追加するリンク（送信カードの「カレンダー追加」と同じ内容） */
        function createCalendarLinkUrl(record) {
            const compact = (date, time) => `${date.replaceAll("-", "")}T${time.replace(":", "")}00`;
            const end = record.end || record.start;
            const params = [
                "action=TEMPLATE",
                `text=${encodeURIComponent(record.memo1 || "予定")}`,
                `dates=${encodeURIComponent(`${compact(record.date, record.start)}/${compact(record.date, end)}`)}`,
                `location=${encodeURIComponent(record.place || "")}`,
                `details=${encodeURIComponent(record.memo2 || "")}`,
                "ctz=Asia%2FTokyo"
            ];
            return `https://calendar.google.com/calendar/render?${params.join("&")}`;
        }

        function createCalendarLink(record) {
            const link = document.createElement("a");
            link.className = "btn btn-small btn-calendar";
            link.href = createCalendarLinkUrl(record);
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "📅 カレンダー追加";
            return link;
        }

        function actionButton(label, className, handler) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = className;
            button.textContent = label;
            button.addEventListener("click", handler);
            return button;
        }

        const OTHER = "__other__";
        const FREQUENT_LIMIT = 8;
        const choices = {
            place: { sel: $("fPlaceSel"), input: $("fPlace"), values: [] },
            memo1: { sel: $("fMemo1Sel"), input: $("fMemo1"), values: [] }
        };

        /** よく使う順（同数なら新しい予定のもの）に、上位だけをプルダウンへ出す */
        function frequentValues(field) {
            const counts = new Map();
            records.forEach(record => {
                const value = record[field];
                if (value) counts.set(value, (counts.get(value) || 0) + 1);
            });
            return [...counts.entries()]
                .sort((a, b) => b[1] - a[1])
                .slice(0, FREQUENT_LIMIT)
                .map(([value]) => value);
        }

        function renderSuggestions() {
            Object.entries(choices).forEach(([field, choice]) => {
                choice.values = frequentValues(field);
                buildChoiceOptions(choice);
            });
        }

        function buildChoiceOptions(choice) {
            const make = (value, label) => {
                const option = document.createElement("option");
                option.value = value;
                option.textContent = label;
                return option;
            };
            choice.sel.replaceChildren(
                make("", "選んでください"),
                ...choice.values.map(value => make(value, value)),
                make(OTHER, "その他（入力する）")
            );
        }

        function setChoiceValue(choice, value) {
            const text = value || "";
            if (!text) {
                choice.sel.value = "";
                choice.input.value = "";
                choice.input.hidden = true;
            } else if (choice.values.includes(text)) {
                choice.sel.value = text;
                choice.input.value = "";
                choice.input.hidden = true;
            } else {
                choice.sel.value = OTHER;
                choice.input.value = text;
                choice.input.hidden = false;
            }
        }

        function getChoiceValue(choice) {
            return (choice.sel.value === OTHER ? choice.input.value : choice.sel.value).trim();
        }

        Object.values(choices).forEach(choice => {
            choice.sel.addEventListener("change", () => {
                const isOther = choice.sel.value === OTHER;
                choice.input.hidden = !isOther;
                if (isOther) choice.input.focus();
            });
        });

        // ---------- カレンダー表示 ----------

        let view = "list";
        let calMonth = todayKey().slice(0, 7);
        let selectedDate = "";

        try { if (localStorage.getItem("admin-view") === "calendar") view = "calendar"; } catch (err) { /* 保存できなくても動く */ }

        /** 内容の1文字目（絵文字は1つの文字として）をアイコンにする */
        function iconOf(memo) {
            const text = String(memo || "").trim();
            if (!text) return "📅";
            if (window.Intl && Intl.Segmenter) {
                const first = new Intl.Segmenter("ja", { granularity: "grapheme" }).segment(text)[Symbol.iterator]().next();
                return first.value.segment;
            }
            return Array.from(text)[0];
        }

        function setView(next) {
            view = next;
            try { localStorage.setItem("admin-view", next); } catch (err) { /* 保存できなくても動く */ }
            applyView();
        }

        function applyView() {
            const isCalendar = view === "calendar";
            els.list.hidden = isCalendar;
            $("calendar").hidden = !isCalendar;
            $("pastLabel").hidden = isCalendar;
            $("tabList").classList.toggle("is-active", !isCalendar);
            $("tabCal").classList.toggle("is-active", isCalendar);
            $("tabList").setAttribute("aria-selected", String(!isCalendar));
            $("tabCal").setAttribute("aria-selected", String(isCalendar));
        }

        function shiftCalMonth(delta) {
            const [y, m] = calMonth.split("-").map(Number);
            const next = new Date(y, m - 1 + delta, 1);
            calMonth = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}`;
            selectedDate = "";
            renderCalendar();
        }

        function renderCalendar() {
            const root = $("calendar");
            const today = todayKey();
            const [year, month] = calMonth.split("-").map(Number);
            const byDate = new Map();
            records.forEach(record => {
                if (!byDate.has(record.date)) byDate.set(record.date, []);
                byDate.get(record.date).push(record);
            });

            const nav = document.createElement("div");
            nav.className = "cal-nav";
            const title = document.createElement("span");
            title.className = "cal-title";
            title.textContent = monthLabel(calMonth);
            nav.append(
                actionButton("◀", "btn", () => shiftCalMonth(-1)),
                title,
                actionButton("▶", "btn", () => shiftCalMonth(1))
            );

            const grid = document.createElement("div");
            grid.className = "cal-grid";
            WEEKDAYS.forEach((name, index) => {
                const dow = document.createElement("div");
                dow.className = `cal-dow${index === 0 ? " sun" : index === 6 ? " sat" : ""}`;
                dow.textContent = name;
                grid.appendChild(dow);
            });

            const leading = new Date(year, month - 1, 1).getDay();
            for (let i = 0; i < leading; i++) {
                const blank = document.createElement("div");
                blank.className = "cal-cell blank";
                grid.appendChild(blank);
            }

            const daysInMonth = new Date(year, month, 0).getDate();
            for (let day = 1; day <= daysInMonth; day++) {
                const date = `${calMonth}-${String(day).padStart(2, "0")}`;
                grid.appendChild(createCalendarCell(date, day, byDate.get(date) || [], today));
            }

            const children = [nav, grid];
            const dayRecords = byDate.get(selectedDate) || [];
            if (selectedDate.startsWith(calMonth) && dayRecords.length) {
                children.push(createDayPanel(selectedDate, dayRecords, today));
            }
            root.replaceChildren(...children);
        }

        function createCalendarCell(date, day, dayRecords, today) {
            const weekday = new Date(date.replaceAll("-", "/")).getDay();
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = ["cal-cell",
                weekday === 0 ? "sun" : weekday === 6 ? "sat" : "",
                dayRecords.length ? "has-events" : "",
                date === today ? "today" : "",
                date < today ? "past" : "",
                date === selectedDate ? "selected" : ""].filter(Boolean).join(" ");
            cell.setAttribute("aria-label", `${date}${dayRecords.length ? `（予定${dayRecords.length}件）` : ""}`);

            const number = document.createElement("span");
            number.className = "cal-day";
            number.textContent = String(day);
            cell.appendChild(number);

            if (dayRecords.length) {
                const icons = document.createElement("span");
                icons.className = "cal-icons";
                icons.textContent = dayRecords.slice(0, 2).map(record => iconOf(record.memo1)).join("");
                cell.appendChild(icons);
                if (dayRecords.length > 2) {
                    const more = document.createElement("span");
                    more.className = "cal-more";
                    more.textContent = `+${dayRecords.length - 2}`;
                    cell.appendChild(more);
                }
            }

            cell.addEventListener("click", () => onDayTap(date, dayRecords));
            return cell;
        }

        /** 予定のない日はそのまま追加フォームへ。予定のある日は、その日の予定と「この日に追加」を出す */
        function onDayTap(date, dayRecords) {
            selectedDate = date;
            renderCalendar();
            if (!dayRecords.length) openEditor(null, false, date);
        }

        function createDayPanel(date, dayRecords, today) {
            const [y, m, d] = date.split("-").map(Number);
            const panel = document.createElement("section");
            panel.className = "day-panel";

            const head = document.createElement("div");
            head.className = "day-head";
            const label = document.createElement("span");
            label.textContent = `${m}月${d}日(${WEEKDAYS[new Date(y, m - 1, d).getDay()]})`;
            head.append(label, actionButton("＋ この日に追加", "btn btn-primary btn-small", () => openEditor(null, false, date)));

            const list = document.createElement("div");
            list.className = "list";
            dayRecords.forEach(record => list.appendChild(createItem(record, today)));

            panel.append(head, list);
            return panel;
        }

        // ---------- 追加・編集 ----------

        function openEditor(record, asCopy, presetDate) {
            editing = record && !asCopy ? record : null;
            els.formTitle.textContent = editing ? "予定を編集" : asCopy ? "予定を複製して追加" : "予定を追加";
            const source = record || {};
            $("fDate").value = asCopy ? "" : (source.date || presetDate || todayKey());
            $("fStart").value = source.start || "";
            $("fEnd").value = source.end || "";
            setChoiceValue(choices.place, source.place);
            setChoiceValue(choices.memo1, source.memo1);
            $("fMemo2").value = source.memo2 || "";
            $("fLink").value = source.link || "";
            if (editing) {
                linkTouched = true;
            } else if (asCopy) {
                // 複製元が月の共通リンクと違う（その予定だけ別リンク）なら、そのまま引き継ぐ
                linkTouched = !!source.link && source.link !== baseLinkFor(source.date.slice(0, 7));
            } else {
                linkTouched = false;
                applyMonthLink();
            }
            setFormError("");
            els.editor.showModal();
        }

        /** 追加のとき、日付の月の共通リンクをリンク欄へ入れる */
        function applyMonthLink() {
            if (editing || linkTouched) return;
            const date = $("fDate").value;
            $("fLink").value = date ? baseLinkFor(date.slice(0, 7)) : "";
        }

        function setFormError(message) {
            els.formError.textContent = message;
            els.formError.hidden = !message;
        }

        function readForm() {
            return {
                date: $("fDate").value,
                start: $("fStart").value,
                end: $("fEnd").value,
                place: getChoiceValue(choices.place),
                memo1: getChoiceValue(choices.memo1),
                memo2: $("fMemo2").value.trim(),
                link: $("fLink").value.trim()
            };
        }

        async function saveForm(event) {
            event.preventDefault();
            const record = readForm();
            if (!record.date || !record.start || !record.place || !record.memo1) {
                return setFormError("日付・開始・場所・内容は必須です。");
            }

            els.saveBtn.disabled = true;
            setFormError("");
            try {
                const result = editing
                    ? await callApi("update", { rowNumber: editing.rowNumber, expected: stripRow(editing), record })
                    : await callApi("add", { record });
                if (!result.ok) return handleApiFailure(result, true);

                applyRecords(result.records);
                els.editor.close();
                showToast(editing ? "更新しました" : "追加しました");
            } catch (err) {
                console.error(err);
                setFormError("通信に失敗しました。もう一度お試しください。");
            } finally {
                els.saveBtn.disabled = false;
            }
        }

        // ---------- 削除 ----------

        async function removeRecord(record) {
            const label = `${record.date} ${record.start} ${record.memo1}`;
            if (!confirm(`この予定を削除しますか？\n${label}`)) return;

            try {
                const result = await callApi("delete", { rowNumber: record.rowNumber, expected: stripRow(record) });
                if (!result.ok) return handleApiFailure(result, false);
                applyRecords(result.records);
                showToast("削除しました");
            } catch (err) {
                console.error(err);
                showToast("通信に失敗しました", true);
            }
        }

        function stripRow(record) {
            const { rowNumber, ...fields } = record;
            return fields;
        }

        async function handleApiFailure(result, inForm) {
            if (result.code === "stale") {
                // シートが変わっている。最新を読み直してから、やり直してもらう
                try { await loadRecords(); } catch (err) { console.error(err); }
                els.editor.close();
                return showToast(result.message, true);
            }
            if (inForm) return setFormError(result.message || "保存できませんでした。");
            showToast(result.message || "失敗しました", true);
        }

        function showToast(message, isError = false) {
            clearTimeout(toastTimer);
            els.toast.textContent = message;
            els.toast.className = `toast${isError ? " error" : ""}`;
            els.toast.hidden = false;
            toastTimer = setTimeout(() => { els.toast.hidden = true; }, 2800);
        }

        // ---------- イベント ----------

        els.form.addEventListener("submit", saveForm);
        $("fDate").addEventListener("change", applyMonthLink);
        $("fLink").addEventListener("input", () => { linkTouched = true; });
        $("cancelBtn").addEventListener("click", () => els.editor.close());
        els.addBtn.addEventListener("click", () => openEditor(null, false, view === "calendar" ? selectedDate : ""));
        $("tabList").addEventListener("click", () => setView("list"));
        $("tabCal").addEventListener("click", () => setView("calendar"));
        els.showPast.addEventListener("change", render);
        $("retryBtn").addEventListener("click", start);
        $("reloadBtn").addEventListener("click", async () => {
            try { await loadRecords(); showToast("最新にしました"); } catch (err) { showToast("読み込みに失敗しました", true); }
        });
        $("copyUserId").addEventListener("click", async () => {
            try { await navigator.clipboard.writeText($("userId").textContent); showToast("コピーしました"); } catch (err) { showToast("コピーできませんでした", true); }
        });

        start();
    </script>
</body>

</html>
