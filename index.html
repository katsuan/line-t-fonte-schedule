<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T-FONTE 予定シェア</title>
    <link rel="icon" href="data:," />

    <link rel="stylesheet" href="style.css?v=202610250457" />
</head>

<body>
    <main class="shell">
        <section class="hero">
            <div class="hero-kicker">T-FONTE REMINDER</div>
            <a class="hero-admin" href="./admin.html">予定の管理 ›</a>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2 class="panel-title">送信プレビュー</h2>
                <div class="panel-head-actions">
                    <div id="summaryChip" class="summary-chip hidden"></div>
                    <button id="reloadBtn" class="mini-button hidden">再読み込み</button>
                </div>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <span>予定を読み込み中...</span>
            </div>

            <div id="messageList" class="message-list hidden"></div>

            <details id="debugPanel" class="debug-panel hidden">
                <summary>送信用JSONを確認</summary>
                <pre id="debugPayload"></pre>
            </details>
        </section>
    </main>

    <footer class="app-footer">
        <div class="footer-inner">
            <div class="button-row">
                <button id="shareBtn" class="button button-primary hidden">LINEで送る</button>
            </div>

            <p id="status" class="status">
                <span id="statusSpinner" class="status-spinner hidden"></span>
                <span id="statusText">初期化中...</span>
            </p>
        </div>
    </footer>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script src="app.js?v=202610250457"></script>
</body>

</html>
